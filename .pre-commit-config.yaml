repos:
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: ./node_modules/.bin/biome check --write --staged --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css)$"
